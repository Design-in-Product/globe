<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tectonic Globe — Explore</title>
<meta name="description" content="Spin the globe freely and scrub through a billion years of continental drift, Rodinia to the present day.">
<style>
  :root {
    --bg: #0a0e14; --text: #dfe6ee; --text-muted: #9fb0c3;
    --border: #223047; --accent: #ff6b35; --font: -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #top {
    position: fixed; top: 0; left: 0; right: 0; padding: 12px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, rgba(10,14,20,0.85), transparent);
    font-size: 0.8rem; color: var(--text-muted);
  }
  #top a { color: var(--text-muted); text-decoration: none; border-bottom: 1px solid var(--border); }
  #top a:hover { color: var(--text); }
  #status { font-variant-numeric: tabular-nums; }

  #ui {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px 22px;
    background: linear-gradient(to top, rgba(10,14,20,0.9), transparent);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #readout { display: flex; align-items: baseline; gap: 10px; }
  #time { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  #era { font-size: 0.85rem; color: var(--text-muted); }
  #track { position: relative; width: min(640px, 88vw); }
  #slider { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
  #ticks { position: relative; height: 26px; margin-top: 2px; }
  .tick { position: absolute; top: 0; width: 1px; height: 6px; background: var(--border); transform: translateX(-0.5px); }
  .tick.major { height: 9px; background: var(--text-muted); }
  .tick-label { position: absolute; top: 11px; transform: translateX(-50%); font-size: 0.62rem; color: var(--text-muted); white-space: nowrap; }
  #hint { font-size: 0.7rem; color: var(--text-muted); text-align: center; }
  @media (max-width: 520px) { .tick-label { display: none; } .tick-label.keep { display: block; } }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="top">
  <a href="../">&larr; Back to the films</a>
  <span id="status">loading&hellip;</span>
</div>
<div id="ui">
  <div id="readout"><span id="time">0 Ma</span><span id="era">Present day</span></div>
  <div id="track">
    <input id="slider" type="range" min="0" max="1000" value="1000" step="1" aria-label="Time, million years before present">
    <div id="ticks"></div>
  </div>
  <div id="hint">Drag to spin &middot; scroll to zoom &middot; slider or &larr; &rarr; keys to move through time</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Sparse-keyframe explorer (roadmap item 5, Phase 1). Textures exist only at
// the film's 15 named eras; the slider crossfades between the two nearest.
// This is the same approximation the shipped film makes at its transitions
// (render_globe.py's dual-texture Mix node), ported to GLSL.
const ASSETS = "../scrubber_assets/";
const MAJOR = new Set([1000, 900, 480, 250, 0]); // labeled ticks; others are marks only

const statusEl = document.getElementById("status");
const timeEl = document.getElementById("time");
const eraEl = document.getElementById("era");
const slider = document.getElementById("slider");
const ticksEl = document.getElementById("ticks");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 3);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById("canvas-wrap").appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.minDistance = 1.5; controls.maxDistance = 6;
controls.enableDamping = true; controls.dampingFactor = 0.08;

const material = new THREE.ShaderMaterial({
  uniforms: { texA: { value: null }, texB: { value: null }, mixFactor: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D texA; uniform sampler2D texB; uniform float mixFactor; varying vec2 vUv;
    void main(){ gl_FragColor = mix(texture2D(texA, vUv), texture2D(texB, vUv), mixFactor); }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), material));

// ---- keyframes: manifest first, textures as they arrive ----
const res = await fetch(ASSETS + "keyframes.json");
const manifest = await res.json();
const KEYFRAMES = manifest.keyframes.slice().sort((a, b) => b.time_ma - a.time_ma); // oldest -> newest
const textures = new Array(KEYFRAMES.length).fill(null);
let loaded = 0;
const loader = new THREE.TextureLoader();
KEYFRAMES.forEach((k, i) => {
  loader.load(ASSETS + k.file, (t) => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    textures[i] = t; loaded++;
    statusEl.textContent = loaded < KEYFRAMES.length ? `loading eras ${loaded}/${KEYFRAMES.length}` : `${KEYFRAMES.length} eras · ${manifest.budget.split(" (")[0]}`;
    applyTime(sliderTime());
  });
});

// slider runs left(old) -> right(new): value v maps to time_ma = 1000 - v
function sliderTime() { return 1000 - Number(slider.value); }

// ticks
KEYFRAMES.forEach((k) => {
  const x = ((1000 - k.time_ma) / 1000) * 100;
  const tick = document.createElement("div");
  tick.className = "tick" + (MAJOR.has(k.time_ma) ? " major" : "");
  tick.style.left = x + "%"; ticksEl.appendChild(tick);
  if (MAJOR.has(k.time_ma)) {
    const lab = document.createElement("div");
    lab.className = "tick-label" + (k.time_ma === 1000 || k.time_ma === 0 ? " keep" : "");
    lab.style.left = x + "%"; lab.textContent = `${k.time_ma} Ma`; ticksEl.appendChild(lab);
  }
});

// nearest loaded texture at-or-before index i (in KEYFRAMES order), for graceful partial loads
function nearestLoaded(i, dir) {
  for (let j = i; j >= 0 && j < KEYFRAMES.length; j += dir) if (textures[j]) return textures[j];
  for (let j = 0; j < KEYFRAMES.length; j++) if (textures[j]) return textures[j];
  return null;
}

function applyTime(t) {
  let lo = 0, hi = KEYFRAMES.length - 1;
  for (let i = 0; i < KEYFRAMES.length - 1; i++) {
    if (t <= KEYFRAMES[i].time_ma && t >= KEYFRAMES[i + 1].time_ma) { lo = i; hi = i + 1; break; }
  }
  const span = KEYFRAMES[lo].time_ma - KEYFRAMES[hi].time_ma;
  const f = span === 0 ? 0 : (KEYFRAMES[lo].time_ma - t) / span;
  material.uniforms.texA.value = textures[lo] || nearestLoaded(lo, -1);
  material.uniforms.texB.value = textures[hi] || nearestLoaded(hi, 1) || material.uniforms.texA.value;
  material.uniforms.mixFactor.value = f;
  timeEl.textContent = `${Math.round(t)} Ma`;
  const near = f < 0.5 ? KEYFRAMES[lo] : KEYFRAMES[hi];
  eraEl.textContent = f === 0 || f === 1 ? near.label : `${KEYFRAMES[lo].label} → ${KEYFRAMES[hi].label}`;
}

slider.addEventListener("input", () => applyTime(sliderTime()));
applyTime(sliderTime());

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
