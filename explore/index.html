<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tectonic Globe — Explore</title>
<meta name="description" content="Spin the globe freely and scrub through 1.8 billion years of continental drift, from the deep-time probability cloud to the present day.">
<style>
  :root {
    --bg: #16212e; --text: #f2f7fb; --text-muted: #c2d4e2;
    --border: #354c63; --accent: #ff6b35; --font: -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #top {
    position: fixed; top: 0; left: 0; right: 0; padding: 12px 18px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, rgba(22,33,46,0.88), transparent);
    font-size: 0.8rem; color: var(--text-muted);
  }
  #top a { color: var(--text-muted); text-decoration: none; border-bottom: 1px solid var(--border); }
  #top a:hover { color: var(--text); }
  #status { font-variant-numeric: tabular-nums; }

  #ui {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px 22px;
    background: linear-gradient(to top, rgba(22,33,46,0.92), transparent);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #readout { display: flex; align-items: baseline; gap: 10px; }
  #time { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  #era { font-size: 0.85rem; color: var(--text-muted); }
  #track { position: relative; width: min(640px, 88vw); }
  #slider { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
  #ticks { position: relative; height: 26px; margin-top: 2px; }
  .tick { position: absolute; top: 0; width: 1px; height: 6px; background: var(--border); transform: translateX(-0.5px); }
  .tick.major { height: 9px; background: var(--text-muted); }
  .tick-label { position: absolute; top: 11px; transform: translateX(-50%); font-size: 0.62rem; color: var(--text-muted); white-space: nowrap; }
  #picker { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #picker button { font-family: var(--font); font-size: 0.72rem; color: var(--text-muted); background: transparent;
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  #picker button.active { color: var(--text); border-color: var(--accent); }
  #picker button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #picker-note { font-size: 0.66rem; color: var(--text-muted); margin-top: -2px; }
  #hint { font-size: 0.7rem; color: var(--text-muted); text-align: center; }
  @media (max-width: 520px) { .tick-label { display: none; } .tick-label.keep { display: block; } }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="top">
  <a href="../">&larr; Back to the films</a>
  <span id="status">loading&hellip;</span>
</div>
<div id="ui">
  <div id="readout"><span id="time">0 Ma</span><span id="era">Present day</span></div>
  <div id="picker" role="group" aria-label="Which future"></div>
  <div id="picker-note">the past is one story; the futures diverge after today &mdash; hold all four, or pick one</div>
  <div id="track">
    <input id="slider" type="range" min="0" max="2050" value="1800" step="1" aria-label="Time: 1800 Ma in the past to 250 Myr in the future">
    <div id="ticks"></div>
  </div>
  <div id="hint">Drag to spin &middot; scroll to zoom &middot; &larr; &rarr; step 10&nbsp;Myr &middot; shift&#8202;+&#8202;&larr;&rarr; jump era to era &middot; home = 1800&nbsp;Ma, end = the far future</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Sparse-keyframe explorer (roadmap item 5, Phase 1). Textures exist only at
// the film's 15 named eras; the slider crossfades between the two nearest.
// This is the same approximation the shipped film makes at its transitions
// (render_globe.py's dual-texture Mix node), ported to GLSL.
const ASSETS = "../scrubber_assets/";

const statusEl = document.getElementById("status");
const timeEl = document.getElementById("time");
const eraEl = document.getElementById("era");
const slider = document.getElementById("slider");
const ticksEl = document.getElementById("ticks");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 3);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById("canvas-wrap").appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.minDistance = 1.5; controls.maxDistance = 6;
controls.enableDamping = true; controls.dampingFactor = 0.08;

const material = new THREE.ShaderMaterial({
  uniforms: { texA: { value: null }, texB: { value: null }, mixFactor: { value: 0 },
             // xian, 09-28 first look: "a bit dark and gloomy. more brightness and
             // higher contrast would do well." The source textures are matplotlib
             // renders on OCEAN_COLOR #1a425a — genuinely dark before any lift.
             brightness: { value: 0.10 }, contrast: { value: 1.18 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D texA; uniform sampler2D texB; uniform float mixFactor;
    uniform float brightness; uniform float contrast; varying vec2 vUv;
    void main(){
      vec3 c = mix(texture2D(texA, vUv), texture2D(texB, vUv), mixFactor).rgb;
      c = (c - 0.5) * contrast + 0.5 + brightness;
      gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), material));

// ---- keyframes: two manifests, merged as layers ----
// The past is one story (Merdith/cao2024 keyframes, time_ma >= 0). The futures
// are four published scenarios plus their superposition, stored as NEGATIVE
// time_ma so the whole axis is one number line: 1800 ... 0 ... -250. Each
// layer is a separate keyframe set; the active set is PAST + one future layer.
// Layering here is the hook a later layer (biome, culture) would also use.
const [pastM, futM] = await Promise.all([
  fetch(ASSETS + "keyframes.json").then(r => r.json()),
  fetch(ASSETS + "future/keyframes-future.json").then(r => r.json()),
]);
const byTimeDesc = (a, b) => b.time_ma - a.time_ma;
const PAST = pastM.keyframes.map(k => ({ ...k, file: ASSETS + k.file })).sort(byTimeDesc);
const FUTURE = {};
for (const k of futM.keyframes) (FUTURE[k.layer] ||= []).push({ ...k, file: ASSETS + "future/" + k.file });
for (const l in FUTURE) FUTURE[l].sort(byTimeDesc);
const LAYER_NAMES = futM.layers;
let layer = "future:super";

const MAX_T = PAST[0].time_ma;                                           // 1800
const layerMin = (l) => FUTURE[l][FUTURE[l].length - 1].time_ma;          // -200 or -250
const GLOBAL_MIN = Math.min(...Object.keys(FUTURE).map(layerMin));       // -250
slider.max = String(MAX_T - GLOBAL_MIN);
slider.value = String(MAX_T);                                            // start at present day
const active = () => PAST.concat(FUTURE[layer]);                         // still descending

const fmt = (t) => t >= 0 ? `${Math.round(t)} Ma` : `+${Math.round(-t)} Myr`;

// ---- textures: on demand, cached by file ----
const loader = new THREE.TextureLoader();
const tex = new Map();           // file -> Texture | null (null = loading)
function ensure(k) {
  if (tex.has(k.file)) return tex.get(k.file);
  tex.set(k.file, null);
  loader.load(k.file, (t) => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.set(k.file, t);
    updateStatus();
    applyTime(sliderTime());
  });
  return null;
}
function updateStatus() {
  const set = active();
  const n = set.filter(k => tex.get(k.file)).length;
  statusEl.textContent = n < set.length
    ? `loading eras ${n}/${set.length}`
    : `${set.length} eras · ${pastM.budget.split(" (")[0]} · future: ${LAYER_NAMES[layer]}`;
}
PAST.forEach(ensure);                                                    // past is always needed

// slider runs left(old) -> right(new): value v maps to time_ma = MAX_T - v
function sliderTime() { return MAX_T - Number(slider.value); }

// ---- picker ----
const pickerEl = document.getElementById("picker");
function buildPicker() {
  pickerEl.innerHTML = "";
  for (const [id, name] of Object.entries(LAYER_NAMES)) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name; b.dataset.layer = id;
    b.className = id === layer ? "active" : "";
    b.addEventListener("click", () => setLayer(id));
    pickerEl.appendChild(b);
  }
}
function setLayer(id) {
  layer = id;
  for (const b of pickerEl.children) b.className = b.dataset.layer === id ? "active" : "";
  FUTURE[layer].forEach(ensure);
  buildTicks();
  const t = sliderTime();
  setTime(t < layerMin(layer) ? layerMin(layer) : t);   // a shorter scenario can't show +250
  updateStatus();
}

// ---- ticks ----
const MAJOR = new Set([1800, 1452, 1000, 480, 250, 0, -100, -200, -250]);
function buildTicks() {
  ticksEl.innerHTML = "";
  const span = MAX_T - GLOBAL_MIN;
  for (const k of active()) {
    const x = ((MAX_T - k.time_ma) / span) * 100;
    const tick = document.createElement("div");
    tick.className = "tick" + (MAJOR.has(k.time_ma) ? " major" : "");
    tick.style.left = x + "%"; ticksEl.appendChild(tick);
    if (MAJOR.has(k.time_ma)) {
      const lab = document.createElement("div");
      lab.className = "tick-label" + (k.time_ma === MAX_T || k.time_ma === 0 || k.time_ma === GLOBAL_MIN ? " keep" : "");
      lab.style.left = x + "%"; lab.textContent = fmt(k.time_ma); ticksEl.appendChild(lab);
    }
  }
}

// nearest loaded texture in the active set, scanning from index i in direction dir
function nearestLoaded(set, i, dir) {
  for (let j = i; j >= 0 && j < set.length; j += dir) { const t = tex.get(set[j].file); if (t) return t; }
  for (const k of set) { const t = tex.get(k.file); if (t) return t; }
  return null;
}

function applyTime(t) {
  const set = active();
  let lo = 0, hi = set.length - 1;
  for (let i = 0; i < set.length - 1; i++) {
    if (t <= set[i].time_ma && t >= set[i + 1].time_ma) { lo = i; hi = i + 1; break; }
  }
  const span = set[lo].time_ma - set[hi].time_ma;
  const f = span === 0 ? 0 : (set[lo].time_ma - t) / span;
  ensure(set[lo]); ensure(set[hi]);
  material.uniforms.texA.value = tex.get(set[lo].file) || nearestLoaded(set, lo, -1);
  material.uniforms.texB.value = tex.get(set[hi].file) || nearestLoaded(set, hi, 1) || material.uniforms.texA.value;
  material.uniforms.mixFactor.value = f;
  timeEl.textContent = fmt(t);
  const strip = (l) => l.replace(/ \(.*\)$/, "");
  eraEl.textContent = f === 0 || f === 1 ? strip((f === 0 ? set[lo] : set[hi]).label)
                                         : `${strip(set[lo].label)} → ${strip(set[hi].label)}`;
}

// ---- time control ----
const STEP_MA = 10;
function setTime(t) {
  t = Math.max(layerMin(layer), Math.min(MAX_T, t));
  slider.value = String(MAX_T - t);
  applyTime(t);
}
function neighbourEra(t, dir) {         // dir -1 = older, +1 = newer
  const times = active().map(k => k.time_ma);          // descending
  const older = times.filter(x => x > t + 0.5);
  const newer = times.filter(x => x < t - 0.5);
  if (dir < 0) return older.length ? Math.min(...older) : MAX_T;
  return newer.length ? Math.max(...newer) : layerMin(layer);
}
slider.addEventListener("input", () => setTime(sliderTime()));
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = sliderTime();
  let next = null;
  if (e.key === "ArrowLeft")       next = e.shiftKey ? neighbourEra(t, -1) : t + STEP_MA;
  else if (e.key === "ArrowRight") next = e.shiftKey ? neighbourEra(t, +1) : t - STEP_MA;
  else if (e.key === "Home")       next = MAX_T;
  else if (e.key === "End")        next = layerMin(layer);
  if (next === null) return;
  e.preventDefault();
  setTime(next);
});

buildPicker();
setLayer(layer);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
