# Publish the site as a GitHub Pages ARTIFACT — no Jekyll pass.
#
# Why (2026-10-06 → 10-09): the legacy Jekyll build ran erratically over this
# ~600 MB tree (65 s, 83 s, 284 s, 11 min, and one 60-min "Page build failed"
# with no diagnostic in a single day; the same signature took the site down
# for six weeks 08-13→09-26). .nojekyll already made the build a plain copy,
# so the pass bought nothing and cost the risk. xian approved the switch
# 2026-10-09 ("Tessera's plan is good").
#
# What publishes (since 2026-11-12): every tracked file except the paths in
# .pages-exclude, staged by scripts/stage_pages.sh and gated by
# scripts/check_pages_refs.py (a page naming an excluded or missing file
# refuses the deploy). Before 11-12 it was the whole checkout, ~809 MB. LFS pointers
# are not resolved — none are tracked (git lfs ls-files = 0), and the legacy
# build never resolved them either.
#
# Revert (one API call, site keeps serving the last deployment meanwhile):
#   gh api -X PUT repos/Design-in-Product/globe/pages \
#     -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/'
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deploy that is already uploading —
# a half-cancelled deploy is how you end up unsure what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/configure-pages@v5
      # 2026-11-12: stage the tracked files minus .pages-exclude (superseded
      # root films and raw plate data no page links, ~295 MB), then gate the
      # staged folder: every src/href/poster/url()/film literal/manifest
      # keyframe a page names must be inside it, or the deploy is refused
      # here rather than 404ing after a green run. No URL changes.
      # 2026-11-13 (brief 11-13, Piper Morgan: a guard on a hook covers only
      # the paths that reach that hook). The pre-commit hook gates page script
      # syntax and manifest coverage, but only for commits made through
      # Tessera's checkout; a page edited on the web UI or from another seat
      # never meets it. Every push meets THIS job, so the same two gates run
      # here, on every tracked page and every tracked manifest (derived).
      - name: Gate every tracked page's inline scripts and every manifest
        run: |
          set -euo pipefail
          pages=$(git ls-files -- '*.html')
          [ -n "$pages" ] || { echo "no tracked .html page — gate did not run"; exit 1; }
          # shellcheck disable=SC2086
          python3 scripts/check_explore_syntax.py $pages
          manifests=$(bash scripts/explore_manifests.sh)
          [ -n "$manifests" ] || { echo "no Explore manifest tracked — gate did not run"; exit 1; }
          # shellcheck disable=SC2086
          python3 scripts/check_explore_manifest.py $manifests
      - name: Stage the site (tracked files minus .pages-exclude, gated)
        run: bash scripts/stage_pages.sh _site
      # 2026-11-13: the artifact is named per ATTEMPT. Re-running the failed
      # job of run 43533876097 uploaded a second "github-pages" beside the
      # first attempt's, and deploy-pages refused ("Multiple artifacts named
      # github-pages were unexpectedly found … count is 2") — so a re-run of
      # this one-job workflow could never recover. With the attempt number in
      # the name, each attempt deploys its own upload.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      # 2026-11-13: runs 43533876097 and 43534509609 (first attempts) each
      # finalized the upload and, 0.3-1 s later, deploy-pages listed this
      # run's artifacts through the Actions results service, found 0, and
      # failed before creating any deployment ("No artifacts named … were
      # found"). The re-run of the second found its upload at once and
      # deployed. A gate that polled the REST artifacts listing passed on
      # both failing runs — that listing is not the store deploy-pages reads,
      # so it proved nothing and was removed the same evening. What is left
      # is the failure's own shape: fast, pre-deployment, transient — so the
      # deploy step runs a second time after 30 s if the first fails. When
      # deploy-pages fails after a deployment exists it has either cancelled
      # it (timeout, too many status errors — deployment.js) or the Pages
      # side has already marked it failed, so the retry never stacks two
      # live deployments.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # The action polls the Pages backend and ABORTS the deployment when
          # its poll window closes. 600000 ms (10 min) is the action's MAXIMUM:
          # the 1800000 set on 11-10 was clamped every run ("timeout value is
          # greater than the allowed maximum - timeout set to the maximum of
          # 600000", visible in each deploy log), so the longer window was
          # never in force. syncing_files normally takes 1-2 min; it took ~9
          # min on 2026-11-09 and >10 min twice on 2026-11-10 (two aborts of
          # 2d5e09b, ~755 MB artifact, GitHub Git-operations incident). The
          # artifact has been ~532 MB since 11-12 (.pages-exclude).
          timeout: 600000
      - name: Deploy failed on the first try — wait 30 s and deploy again
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "first deploy-pages attempt failed (outcome=${{ steps.deployment.outcome }}); retrying in 30 s"
          sleep 30
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
